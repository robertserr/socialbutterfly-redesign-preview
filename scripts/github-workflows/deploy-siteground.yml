# Manual upload to SiteGround. This does not run on its own.
# Do not start it until: (1) WordPress in public_html has been backed up,
# (2) the public SSH key has been added in Site Tools → SSH Keys Manager,
# and (3) the GitHub secret SITEGROUND_SSH_KEY holds the matching private key.
#
# Known SiteGround details for socialbutterfly.agency (StartUp):
#   Host:     gtxm1087.siteground.biz
#   Port:     18765
#   Username: u1214-2rysfpfe4znk
#   Folder:   the site's public_html directory
#   Keep:     public_html/.well-known (do not overwrite or delete it)
#
# GitHub secrets (Settings → Secrets and variables → Actions):
#   SITEGROUND_SSH_KEY   Private key that matches the public key added in Site Tools
#   SITEGROUND_PATH      Full path to public_html (from Site Tools / SSH account details)
# Optional overrides, only if SiteGround changes the login:
#   SITEGROUND_HOST, SITEGROUND_PORT, SITEGROUND_USERNAME
#
# This job builds a public (indexable) copy and uploads index.html, assets/,
# and robots.txt. It does not delete existing files, so WordPress files stay
# until they are removed by hand after a backup. .well-known is excluded.

name: Upload to SiteGround

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check SiteGround secrets
        env:
          KEY: ${{ secrets.SITEGROUND_SSH_KEY }}
          REMOTE: ${{ secrets.SITEGROUND_PATH }}
        run: |
          if [ -z "$KEY" ] || [ -z "$REMOTE" ]; then
            echo "Add GitHub secrets SITEGROUND_SSH_KEY and SITEGROUND_PATH before running this workflow."
            echo "SITEGROUND_PATH should be the full path to the site's public_html folder."
            exit 1
          fi

      - name: Install build tools
        run: pip install -r requirements-build.txt

      - name: Build production files
        run: python scripts/build_site.py --production --out-dir _site

      - name: Upload to SiteGround over SSH
        env:
          HOST: ${{ secrets.SITEGROUND_HOST }}
          PORT: ${{ secrets.SITEGROUND_PORT }}
          USER: ${{ secrets.SITEGROUND_USERNAME }}
          KEY: ${{ secrets.SITEGROUND_SSH_KEY }}
          REMOTE: ${{ secrets.SITEGROUND_PATH }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          HOST="${HOST:-gtxm1087.siteground.biz}"
          PORT="${PORT:-18765}"
          USER="${USER:-u1214-2rysfpfe4znk}"
          # Normalize path: if only "public_html" is given, still use it as-is
          # (set the full path in SITEGROUND_PATH when known).
          rsync -avz --exclude '.well-known' \
            -e "ssh -p $PORT -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes" \
            _site/index.html _site/robots.txt _site/assets \
            "$USER@$HOST:$REMOTE/"
