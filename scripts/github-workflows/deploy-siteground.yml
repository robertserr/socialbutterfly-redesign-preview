# Manual upload to SiteGround. This does not run on its own.
#
# WordPress was moved out of public_html on 2026-11-10 to:
#   /home/u1214-2rysfpfe4znk/www/socialbutterfly.agency/wp-old-2026-11-10/
# The live site is the static production build. This job rebuilds that
# public (indexable) copy and uploads it. It does not delete files, and
# it never touches .well-known.
#
# SiteGround details for socialbutterfly.agency (StartUp):
#   Host:     gtxm1087.siteground.biz  (A record 34.174.165.188)
#   Port:     18765
#   Username: u1214-2rysfpfe4znk
#   Path:     /home/u1214-2rysfpfe4znk/www/socialbutterfly.agency/public_html
#   Keep:     public_html/.well-known (do not overwrite or delete it)
#
# GitHub secrets (Settings → Secrets and variables → Actions):
#   SITEGROUND_SSH_KEY   Private key that matches the public key in Site Tools
#                        (the key already imported there is named boxdeploy)
#   SITEGROUND_PATH      /home/u1214-2rysfpfe4znk/www/socialbutterfly.agency/public_html
# Optional overrides, only if SiteGround changes the login:
#   SITEGROUND_HOST, SITEGROUND_PORT, SITEGROUND_USERNAME
#
# Uploads: index.html, assets/, robots.txt, sitemap.xml, and .htaccess.

name: Upload to SiteGround

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check SiteGround secrets
        env:
          KEY: ${{ secrets.SITEGROUND_SSH_KEY }}
          REMOTE: ${{ secrets.SITEGROUND_PATH }}
        run: |
          if [ -z "$KEY" ] || [ -z "$REMOTE" ]; then
            echo "Add GitHub secrets SITEGROUND_SSH_KEY and SITEGROUND_PATH before running this workflow."
            echo "SITEGROUND_PATH should be:"
            echo "  /home/u1214-2rysfpfe4znk/www/socialbutterfly.agency/public_html"
            exit 1
          fi

      - name: Install build tools
        run: pip install -r requirements-build.txt

      - name: Build production files
        run: python scripts/build_site.py --production --out-dir _site

      - name: Upload to SiteGround over SSH
        env:
          HOST: ${{ secrets.SITEGROUND_HOST }}
          PORT: ${{ secrets.SITEGROUND_PORT }}
          USER: ${{ secrets.SITEGROUND_USERNAME }}
          KEY: ${{ secrets.SITEGROUND_SSH_KEY }}
          REMOTE: ${{ secrets.SITEGROUND_PATH }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          HOST="${HOST:-gtxm1087.siteground.biz}"
          PORT="${PORT:-18765}"
          USER="${USER:-u1214-2rysfpfe4znk}"
          rsync -avz --exclude '.well-known' \
            -e "ssh -p $PORT -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes" \
            _site/index.html _site/robots.txt _site/sitemap.xml _site/.htaccess _site/assets \
            "$USER@$HOST:$REMOTE/"
